<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5C7E60"/>
      <stop offset="100%" stop-color="#3A533C"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect width="512" height="512" rx="128" fill="url(#sageGrad)"/>
  
  <!-- Architectural Cube / Building Symbol -->
  <g filter="url(#shadow)">
    <!-- Outer isometric hexagon -->
    <polygon points="256,110 390,188 390,342 256,420 122,342 122,188" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linejoin="round"/>
    
    <!-- Isometric Top Plane -->
    <polygon points="256,110 390,188 256,265 122,188" fill="#FFFFFF" fill-opacity="0.2" stroke="#FFFFFF" stroke-width="20" stroke-linejoin="round"/>
    
    <!-- Central axes -->
    <line x1="256" y1="265" x2="256" y2="420" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round"/>
    <line x1="256" y1="265" x2="390" y2="188" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round"/>
    <line x1="256" y1="265" x2="122" y2="188" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round"/>
    
    <!-- Architectural grid accent line -->
    <circle cx="256" cy="265" r="16" fill="#FFFFFF"/>
  </g>
</svg>